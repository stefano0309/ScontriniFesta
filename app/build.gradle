plugins {
    id 'com.android.application'
}

android {
    namespace 'it.talloncinicassa.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.talloncinicassa.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Dichiarato esplicitamente invece di lasciarlo implicito: evita
    // ambiguità/warning del toolchain con AGP + compileSdk 35.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Il progetto non applica alcun plugin Kotlin (nessun codice Kotlin da
// compilare), ma diverse dipendenze AndroidX (androidx.core, androidx.activity)
// portano transitivamente kotlin-stdlib. Senza il plugin Kotlin non scatta
// l'allineamento automatico delle versioni: kotlin-stdlib può finire risolto
// a una versione diversa da kotlin-stdlib-jdk7/-jdk8, che dalla 1.8 in poi
// contengono classi già incluse in kotlin-stdlib stesso -> "duplicate class"
// in fase di merge (vedi errore checkDebugDuplicateClasses). Si forzano
// quindi tutti e tre i moduli sulla STESSA versione per evitare la
// sovrapposizione.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    // Necessario per androidx.activity.ComponentActivity, la Activity
    // Result API (registerForActivityResult) e OnBackPressedCallback usati
    // in MainActivity al posto delle API deprecate.
    implementation 'androidx.activity:activity:1.9.3'

    // Necessario per WindowCompat / WindowInsetsControllerCompat, usati per
    // gestire le barre di sistema in modo non deprecato (sostituisce
    // View.SYSTEM_UI_FLAG_*) e compatibile con l'edge-to-edge forzato da
    // targetSdk 35. È comunque una dipendenza transitiva di
    // androidx.appcompat, ma la dichiariamo esplicitamente perché ne
    // usiamo direttamente le API.
    implementation 'androidx.core:core:1.13.1'

    // NOTA: androidx.appcompat non è usato da MainActivity (che estende
    // ComponentActivity, non AppCompatActivity). Lasciato qui perché non
    // è possibile verificare, dai soli file forniti, se temi/risorse XML
    // dell'app dipendono da Theme.AppCompat: va rimosso solo dopo aver
    // controllato styles.xml / AndroidManifest.xml.
    implementation 'androidx.appcompat:appcompat:1.7.0'
}