name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Dipendenze
      - name: Install dependencies
        run: npm ci

      # Capacitor
      - name: Sync Capacitor
        run: npx cap sync ios

      # CocoaPods
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      # Build iOS Simulator
      - name: Build iOS
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Upload
      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: TallonciniCassa-iOS
          path: ios/App/build
          if-no-files-found: error