name: Deploy React + Capacitor (www) to GitHub Pages

on:
  push:
    branches: ["main"]

  # Permette di avviare il workflow manualmente dalla scheda Actions di GitHub
  workflow_dispatch:

# Imposta i permessi per consentire il deployment su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permette un solo deployment simultaneo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Build del progetto React
        run: npm run build

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact dalla cartella www
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www' # Punto fondamentale: legge i file compilati in ./www

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
