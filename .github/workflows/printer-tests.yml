name: Printer System Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'www/**'
      - 'android/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/printer-tests.yml'


jobs:

  printer-tests:

    name: Printer Architecture Tests

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # NODE
      # ========================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm


      - name: Install dependencies
        run: npm ci


      # ========================================================
      # PROJECT STRUCTURE
      # ========================================================

      - name: Verify Printer Architecture
        run: |

          echo "=== PRINTER ARCHITECTURE ==="

          test -d www

          echo "✓ Webapp presente"

          # Cerca i servizi printer senza imporre un nome preciso
          PRINTER_FILES=$(find www -type f \
            \( -iname "*printer*" -o -iname "*escpos*" \))

          if [ -z "$PRINTER_FILES" ]; then
            echo "⚠ Nessun modulo printer trovato"
            echo "Questo test verrà reso obbligatorio quando il nuovo PrinterService sarà implementato."
          else
            echo "Moduli printer trovati:"
            echo "$PRINTER_FILES"
          fi


      # ========================================================
      # ESC/POS
      # ========================================================

      - name: Verify ESC/POS Layer
        run: |

          echo "=== ESC/POS ==="

          ESC_FILES=$(find . -type f \
            \( -iname "*escpos*" -o -iname "*esc-pos*" \) \
            -not -path "./node_modules/*")

          if [ -z "$ESC_FILES" ]; then
            echo "⚠ Modulo ESC/POS non ancora trovato"
          else
            echo "$ESC_FILES"
            echo "✓ Modulo ESC/POS individuato"
          fi


      # ========================================================
      # JAVASCRIPT SYNTAX
      # ========================================================

      - name: Test Printer JavaScript
        run: |

          echo "=== PRINTER JAVASCRIPT ==="

          JS_FILES=$(find www -type f -name "*.js")

          for file in $JS_FILES; do

            node --check "$file"

            echo "✓ $file"

          done


      # ========================================================
      # CAPACITOR
      # ========================================================

      - name: Sync Capacitor Android
        run: |

          npx cap sync android


      - name: Verify Android Capacitor Project
        run: |

          test -d android
          test -f android/gradlew

          echo "✓ Android Capacitor project"


      # ========================================================
      # ANDROID BUILD
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build Android
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      # ========================================================
      # REPORT
      # ========================================================

      - name: Printer Test Summary
        run: |

          echo ""
          echo "============================================"
          echo "PRINTER TESTS"
          echo "============================================"
          echo ""
          echo "✓ Web printer layer analizzato"
          echo "✓ JavaScript verificato"
          echo "✓ Capacitor sincronizzato"
          echo "✓ Android compilato"
          echo ""