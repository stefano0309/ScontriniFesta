name: Printer System Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'www/**'
      - 'android/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/printer-tests.yml'

jobs:
  printer-tests:
    name: Printer Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify thermal printer dependency
        run: |
          node -e "const p=require('./package.json'); if(!p.dependencies['@delicity/capacitor-thermal-printer']) process.exit(1); console.log('✓ @delicity/capacitor-thermal-printer presente')"
          npm list @delicity/capacitor-thermal-printer

      - name: Verify Printer Architecture
        run: |
          test -d www
          test -f www/printers-ui.js
          node --check www/printers-ui.js
          echo "✓ www/printers-ui.js valido"

      - name: Verify Capacitor printer bridge
        run: |
          grep -q "registerPlugin('ThermalPrinter')" www/printers-ui.js
          grep -q "discoverPrinters" www/printers-ui.js
          grep -q "printText" www/printers-ui.js
          grep -q "connectPrinter" www/printers-ui.js
          echo "✓ API ThermalPrinter collegata"

      - name: Verify JavaScript syntax
        run: |
          find www -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
            echo "✓ $file"
          done

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android Capacitor project
        run: |
          test -d android
          test -f android/gradlew
          grep -q "minSdkVersion = 26" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          echo "✓ Android Capacitor project e SDK corretti"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Printer Test Summary
        run: |
          echo "============================================"
          echo "PRINTER TESTS"
          echo "============================================"
          echo "✓ Plugin npm presente"
          echo "✓ Bridge ThermalPrinter presente"
          echo "✓ JavaScript verificato"
          echo "✓ Capacitor sincronizzato"
          echo "✓ Android SDK 36 + JDK 21"
          echo "✓ APK compilato"
