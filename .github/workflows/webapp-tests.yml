name: Webapp Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/webapp-tests.yml'

jobs:

  webapp-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm


      - name: Install dependencies
        run: npm ci


      # ========================================================
      # HTML
      # ========================================================

      - name: Verify HTML
        run: |

          HTML="www/index.html"

          test -f "$HTML"

          grep -qi "<html" "$HTML"
          grep -qi "<head" "$HTML"
          grep -qi "<body" "$HTML"

          echo "✓ HTML verificato"


      # ========================================================
      # JAVASCRIPT
      # ========================================================

      - name: Verify JavaScript
        run: |

          JS_FILES=$(find www -name "*.js")

          for file in $JS_FILES; do

            echo "Checking $file"

            node --check "$file"

            echo "✓ $file"

          done


      # ========================================================
      # PRINTER MODULE
      # ========================================================

      - name: Detect Printer Modules
        run: |

          echo "=== PRINTER MODULES ==="

          find www -type f \
            \( -iname "*printer*" -o -iname "*escpos*" \) \
            -print


      # ========================================================
      # CAPACITOR API
      # ========================================================

      - name: Verify Capacitor
        run: |

          npm list @capacitor/core
          npm list @capacitor/cli

          echo "✓ Capacitor installato"


      # ========================================================
      # CAPACITOR SYNC
      # ========================================================

      - name: Sync Capacitor
        run: |

          npx cap sync


      # ========================================================
      # REPORT
      # ========================================================

      - name: Test Summary
        run: |

          echo ""
          echo "============================================"
          echo "WEBAPP TESTS COMPLETED"
          echo "============================================"
          echo ""
          echo "✓ HTML"
          echo "✓ JavaScript"
          echo "✓ Printer modules"
          echo "✓ Capacitor"
          echo "✓ Capacitor sync"