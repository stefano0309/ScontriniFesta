name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione release, es. 2.0.0'
        required: true
        default: '2.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=ScontriniFesta-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-react/package-lock.json

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Install React dependencies
        working-directory: src-react
        run: npm ci

      - name: Build React web app
        working-directory: src-react
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [[ ! -s android/app/release.keystore ]]; then
            echo "The decoded Android keystore is empty or invalid." >&2
            exit 1
          fi

          cat > android/keystore.properties <<EOF
storeFile=${GITHUB_WORKSPACE}/android/app/release.keystore
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text()

          header = '''def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''

          if 'def keystorePropertiesFile' not in text:
              text = header + text

          signing_block = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          '''

          if 'signingConfigs {' not in text:
              marker = '    buildTypes {'
              if marker not in text:
                  raise SystemExit('Unable to locate buildTypes in android/app/build.gradle')
              text = text.replace(marker, signing_block + '\n' + marker, 1)

          release_marker = '''        release {
            minifyEnabled false'''
          release_replacement = '''        release {
            signingConfig signingConfigs.release
            minifyEnabled false'''

          if 'signingConfig signingConfigs.release' not in text:
              if release_marker not in text:
                  raise SystemExit('Unable to locate release build type in android/app/build.gradle')
              text = text.replace(release_marker, release_replacement, 1)

          path.write_text(text)
          PY

          test -f android/app/release.keystore
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          grep -q 'storeFile file(keystoreProperties' android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          echo "Signed APK created successfully."

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/${{ steps.version.outputs.APK_NAME }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScontriniFesta-v${{ steps.version.outputs.version }}-APK
          path: release/${{ steps.version.outputs.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScontriniFesta v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/${{ steps.version.outputs.APK_NAME }}
